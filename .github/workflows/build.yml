name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Remove any previous Android folder
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Copy custom theme
        run: |
          if [ -d "resources/android/res/values" ]; then
            cp -r resources/android/res/values android/app/src/main/res/
          fi

      - name: Accept Android SDK licenses & install required packages
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0" || true

      - name: Build APK (capture ALL output)
        id: build
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          echo "GRADLE_EXIT_CODE=$?" >> $GITHUB_ENV

      - name: Print the ENTIRE build log (so we can see the error)
        if: always()
        run: |
          if [ -f android/build.log ]; then
            echo "========== FULL GRADLE OUTPUT =========="
            cat android/build.log
          else
            echo "build.log not found in android/"
          fi

      - name: Upload APK (only if build succeeded)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: metafoot-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk