name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Remove any previous Android folder
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Copy all manual resources (icons, splash, styles)
      - name: Copy manual resources
        run: |
          if [ -d "resources/android/res" ]; then
            cp -r resources/android/res/* android/app/src/main/res/
          fi

      # Remove adaptive icon XML so your manual PNGs are used
      - name: Remove adaptive icon XML
        run: rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      # Apply the custom theme to AndroidManifest.xml
      - name: Apply custom theme
        run: |
          sed -i 's/<application /<application android:theme="@style\/AppTheme" /' android/app/src/main/AndroidManifest.xml

      - name: Accept Android SDK licenses & install required packages
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0" || true

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metafoot-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk