name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Remove any previous Android folder
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # ---- ONLY CHANGE: make the splash background red (no file copying) ----
      - name: Change splash background to red
        run: |
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ]; then
            # Replace whatever windowBackground is currently set to, with our red
            sed -i 's|<item name="android:windowBackground">.*</item>|<item name="android:windowBackground">#ff5555</item>|' "$STYLES"
            # Also set status bar colour to red
            sed -i 's|<item name="android:statusBarColor">.*</item>|<item name="android:statusBarColor">#ff5555</item>|' "$STYLES"
            echo "Splash background changed to red."
          else
            echo "styles.xml not found – skipping."
          fi

      - name: Accept Android SDK licenses & install required packages
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0" || true

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metafoot-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk